name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# One run at a time. Two quick pushes to main would otherwise run release-please and
# ship-release-tracking concurrently against the same release PR branch. Queued, not
# cancelled: a cancelled run could drop a release or its publish.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      # Read by ship-release-tracking. A step output is only visible to another job
      # when the job re-exports it here; without these the job's `if:` is always false.
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      # Pushes and PRs made with GITHUB_TOKEN trigger no workflows, so bot PRs
      # never got their required checks. A token from the release bot GitHub App
      # acts as the App, and its pushes trigger CI like anyone else's.
      - name: Mint a release bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # The release bot App token from the step above, not GITHUB_TOKEN.
          #
          # A release PR opened with GITHUB_TOKEN does not get its checks run normally:
          # they land in action_required and wait for a human. build-test and the smoke
          # checks are required here, so the release PR could not merge until someone
          # approved each run by hand. 1.7.0 needed exactly that. The App token replaces
          # the RELEASE_PLEASE_TOKEN PAT the other ZeroAlloc repositories used: it does
          # not expire and does not act as a person.
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json

  # Marks the analyzer rules and public API that the pending release adds as shipped,
  # by committing the move onto the release PR branch. Merging that PR then lands the
  # move in the same commit that tags the release, so AnalyzerReleases.Shipped.md and
  # PublicAPI.Shipped.txt always say what each published version contains. Without
  # this the Unshipped files kept growing across every release until #252: nothing was
  # ever marked shipped, so the analyzers could not flag a change to a shipped rule
  # or a shipped API.
  #
  # The job and its script are shared across the org from ZeroAlloc-Net/.github, which
  # took them from this repo; see ZeroAlloc-Net/.github#38. release-please rebuilds its
  # branch from main whenever main moves, dropping this commit; the job then runs again
  # in the same workflow run and re-applies it. It commits nothing when nothing is
  # unshipped.
  ship-release-tracking:
    needs: release-please
    if: ${{ needs.release-please.outputs.prs_created == 'true' }}
    uses: ZeroAlloc-Net/.github/.github/workflows/ship-release-tracking.yml@main
    with:
      branch: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
    secrets:
      # The shared workflow mints a release bot App token from this key, so
      # its push triggers the release PR's checks like release-please's own.
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

  # Publishing lives here rather than in a workflow listening for
  # `release: published`. A release created with GITHUB_TOKEN does not trigger
  # other workflows — GitHub suppresses that cascade to prevent recursive runs —
  # so pack-push.yml silently stopped firing after v1.6.0, and v1.6.1 and v1.6.2
  # were tagged, announced and never published. Nothing failed; the workflow
  # simply never ran. Dispatching pack-push.yml from here would not help either,
  # since the same restriction applies to workflow_dispatch via GITHUB_TOKEN.
  # Running in the same job graph avoids the cross-workflow event entirely.
  #
  # pack-push.yml is kept for manual rescue via workflow_dispatch.
  # Builds the release tag, packs every packable project, checks the versions inside the
  # packages, pushes them, and waits until nuget.org serves every one of them. Shared from
  # ZeroAlloc-Net/.github so a fix there reaches every repository; see ZeroAlloc-Net/.github#49.
  #
  # The tests run here again. They were skipped over a Verify.NET path problem with an explicit
  # -p:Version; Verify was replaced by GeneratorSnapshot in #204, which passes with it.
  #
  # No `solution` input: global.json selects Microsoft.Testing.Platform, whose dotnet test takes
  # a solution only through --solution, so the default test step relies on the single
  # ZeroAlloc.ORM.slnx in the root being found, as ci.yml does.
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ZeroAlloc-Net/.github/.github/workflows/publish.yml@main
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      version: ${{ needs.release-please.outputs.version }}
      # This repository has never published to GitHub Packages or attached its packages to
      # the GitHub release; the migration keeps its destinations as they are.
      github-packages: false
      release-assets: false
    secrets:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
