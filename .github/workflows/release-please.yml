name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# One run at a time. Two quick pushes to main would otherwise run release-please and
# ship-release-tracking concurrently against the same release PR branch. Queued, not
# cancelled: a cancelled run could drop a release or its publish.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      # Read by ship-release-tracking. A step output is only visible to another job
      # when the job re-exports it here; without these the job's `if:` is always false.
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # Prefer a PAT, fall back to GITHUB_TOKEN when none is configured.
          #
          # A release PR opened with GITHUB_TOKEN does not get its checks run normally:
          # they land in action_required and wait for a human. build-test and the smoke
          # checks are required here, so the release PR cannot merge until someone
          # approves each run by hand. 1.7.0 needed exactly that.
          #
          # The fallback keeps this safe to merge before the secret exists: an undefined
          # secret is an empty string, so this resolves to GITHUB_TOKEN and behaves as it
          # does today. Adding RELEASE_PLEASE_TOKEN switches it over with no further
          # change. Every other ZeroAlloc repository already uses the PAT.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json

  # Marks the analyzer rules and public API that the pending release adds as shipped,
  # by committing the move onto the release PR branch. Merging that PR then lands the
  # move in the same commit that tags the release, so AnalyzerReleases.Shipped.md and
  # PublicAPI.Shipped.txt always say what each published version contains. Without
  # this the Unshipped files kept growing across every release until #252: nothing was
  # ever marked shipped, so the analyzers could not flag a change to a shipped rule
  # or a shipped API.
  #
  # release-please rebuilds its branch from main whenever main moves, dropping this
  # commit; the job then runs again in the same workflow run and re-applies it. The
  # script is idempotent and commits nothing when nothing is unshipped.
  ship-release-tracking:
    needs: release-please
    if: ${{ needs.release-please.outputs.prs_created == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          # Same token as release-please, so this push triggers the PR's checks
          # exactly as release-please's own push does.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Move Unshipped entries to Shipped
        run: |
          version=$(jq -r '."."' .release-please-manifest.json)
          python3 scripts/ship-release-tracking.py "$version"
          if git diff --quiet; then
            echo "Nothing unshipped for $version."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: mark analyzer rules and public api shipped in $version"
          git push

  # Publishing lives here rather than in a workflow listening for
  # `release: published`. A release created with GITHUB_TOKEN does not trigger
  # other workflows — GitHub suppresses that cascade to prevent recursive runs —
  # so pack-push.yml silently stopped firing after v1.6.0, and v1.6.1 and v1.6.2
  # were tagged, announced and never published. Nothing failed; the workflow
  # simply never ran. Dispatching pack-push.yml from here would not help either,
  # since the same restriction applies to workflow_dispatch via GITHUB_TOKEN.
  # Running in the same job graph avoids the cross-workflow event entirely.
  #
  # pack-push.yml is kept for manual rescue via workflow_dispatch.
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Installs the SDK global.json pins. Without it the job never installs
          # that SDK at all and only works when the runner image happens to ship one
          # satisfying the pin, which is how a publish failed on a lagging image.
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release -p:Version=${{ needs.release-please.outputs.version }}

      # Test step intentionally omitted: the build-test workflow already validates
      # every push to main with the full test suite (75+ tests). Re-running them here
      # would (a) duplicate work and (b) trip a Verify.NET path-resolution edge case
      # on two snapshot tests when MSBuild's Version is set explicitly. This job's
      # role is to pack + push, not re-validate.

      - name: Pack
        run: |
          # Discovered, not listed. A hardcoded list silently omits any newly added
          # package: the release still goes green and the package never appears on
          # NuGet. Defaulting to pack means a new src project ships unless it opts
          # out, so the failure mode is a surplus package someone notices rather
          # than a missing one nobody does.
          for csproj in src/*/*.csproj; do
            if grep -q "<IsPackable>false</IsPackable>" "$csproj"; then
              echo "Skipping $csproj (IsPackable=false)"
              continue
            fi
            echo "Packing $csproj"
            dotnet pack "$csproj" --no-build -c Release -p:PackageVersion=${{ needs.release-please.outputs.version }} -o ./artifacts
          done
          if ! ls ./artifacts/*.nupkg >/dev/null 2>&1; then
            echo "::error::no packages were produced"
            exit 1
          fi

      - name: Push to NuGet
        run: dotnet nuget push ./artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate
