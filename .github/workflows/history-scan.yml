name: history-scan

# Full-history secret scan across every ref, run by hand. GITLEAKS_CONFIG is optional and holds extra rules.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  history-scan:
    uses: MarcelRoozekrans/ci-baseline/.github/workflows/history-scan.yml@v1
    secrets:
      GITLEAKS_CONFIG: ${{ secrets.GITLEAKS_CONFIG }}
