name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    # ubuntu-latest ships Docker Engine pre-installed, which the v0.6 Postgres
    # integration suite (tests/ZeroAlloc.ORM.Integration.Tests/Postgres/) needs
    # — Testcontainers.PostgreSql boots a `postgres:16-alpine` container per
    # test fixture instance. Switching to a runner without Docker (e.g.
    # windows-latest without Docker Desktop) will break the Postgres tests;
    # the Sqlite + snapshot + AOT-smoke suites do NOT depend on Docker.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Installs the SDK global.json pins. Without it the job never installs
          # that SDK at all and only works when the runner image happens to ship one
          # satisfying the pin, which is how a publish failed on a lagging image.
          global-json-file: global.json
          dotnet-version: 10.0.x

      # Pin the Docker prereq for the Postgres integration fixture (A.5).
      # Surfaces a clear error if a future runner image drops Docker pre-
      # install instead of failing deep in the Testcontainers boot path.
      - name: Verify Docker is available (for Postgres integration tests)
        run: |
          docker --version
          echo "::group::docker info"
          docker info
          echo "::endgroup::"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

  # A release PR must mark everything it releases as shipped: the analyzer rules in
  # AnalyzerReleases.Unshipped.md and the API in every PublicAPI.Unshipped.txt. The
  # ship-release-tracking job in release-please.yml commits that move onto the branch;
  # this fails the PR if the move is missing, or if a later commit on the branch adds
  # entries after it. The checkout is the merge ref, so it sees what would land on main.
  release-tracking:
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check nothing is left unshipped
        run: python3 scripts/ship-release-tracking.py --check

  # ZeroAlloc.ORM published four packages with no API gate at all -- the only
  # repo in the org with zero coverage. No inputs: the workflow discovers every
  # packable project under src/ and compares each against its own published
  # baseline. See ZeroAlloc-Net/.github#30.
  api-compat:
    uses: ZeroAlloc-Net/.github/.github/workflows/api-compat.yml@main
