name: Pack and Push

# Manual rescue only. The automatic path lives in release-please.yml's `publish`
# job, which runs in the same job graph as the release itself.
#
# This workflow used to listen for `release: published`. That trigger can never
# fire here: releases created by `googleapis/release-please-action` with the
# default GITHUB_TOKEN do not raise events on other workflows (recursive-run
# protection). The limitation was known and documented, with the manual trigger
# as the intended workaround — but a publish step that must be remembered every
# release eventually is not, and v1.6.1 and v1.6.2 were both tagged, announced
# and never published. Nothing failed; the workflow simply never ran.
#
# The dead trigger is removed rather than left in place, because a trigger that
# looks automatic is what made those two releases look fine.
#
# Build once, then pack each package explicitly so the published set stays
# auditable. --skip-duplicate makes re-runs safe.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to pack + push (e.g. 0.1.0 — NO leading v)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # workflow_dispatch is the only trigger, so the version always comes from the
      # input. The old tag branch read github.event.release, which cannot be
      # populated any more.
      - name: Read version from workflow input
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release -p:Version=${{ steps.version.outputs.version }}

      # Test step intentionally omitted: the build-test workflow already validates
      # every push to main with the full test suite (75+ tests). Re-running them here
      # would (a) duplicate work and (b) trip a Verify.NET path-resolution edge case
      # on two snapshot tests when MSBuild's Version is set explicitly. Pack-push's
      # job is to pack + push, not re-validate.

      - name: Pack
        run: |
          dotnet pack src/ZeroAlloc.ORM.Abstractions/ZeroAlloc.ORM.Abstractions.csproj --no-build -c Release -p:PackageVersion=${{ steps.version.outputs.version }} -o ./artifacts
          dotnet pack src/ZeroAlloc.ORM/ZeroAlloc.ORM.csproj --no-build -c Release -p:PackageVersion=${{ steps.version.outputs.version }} -o ./artifacts
          dotnet pack src/ZeroAlloc.ORM.Generator/ZeroAlloc.ORM.Generator.csproj --no-build -c Release -p:PackageVersion=${{ steps.version.outputs.version }} -o ./artifacts
          dotnet pack src/ZeroAlloc.TypeConversions/ZeroAlloc.TypeConversions.csproj --no-build -c Release -p:PackageVersion=${{ steps.version.outputs.version }} -o ./artifacts

      - name: Push to NuGet
        run: dotnet nuget push ./artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate
